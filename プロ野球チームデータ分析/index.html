<!DOCTYPE html>
<html lang="ja">
<head>
<title>プロ野球チームデータ分析</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

 <body>
    <div class="main-container">
      <h1 align="center">Professional Baseball Analysis</h1>
        
      <h2>データの登録と分析</h2>
  <div class="box">
  
  <p>
    年度：
    <select id="start_Year" name="start_year">
      <option value="2005">2005</option>
      <option value="2006">2006</option>
      <option value="2007">2007</option>
      <option value="2008">2008</option>
      <option value="2009">2009</option>
      <option value="2010">2010</option>
      <option value="2011">2011</option>
      <option value="2012">2012</option>
      <option value="2013">2013</option>
      <option value="2014">2014</option>
      <option value="2015">2015</option>
      <option value="2016">2016</option>
      <option value="2017">2017</option>
      <option value="2018">2018</option>
      <option value="2019">2019</option>
      <option value="2020">2020</option>
      <option value="2021">2021</option>
      <option value="2022">2022</option>
      <option value="2023">2023</option>
      <option value="2024">2024</option>
      <option value="2025">2025</option>
    </select>
   </p> 
  
  <p>
    終了年度：
    <select id="end_Year" name="end_year">
      <option value="2005">2005</option>
      <option value="2006">2006</option>
      <option value="2007">2007</option>
      <option value="2008">2008</option>
      <option value="2009">2009</option>
      <option value="2010">2010</option>
      <option value="2011">2011</option>
      <option value="2012">2012</option>
      <option value="2013">2013</option>
      <option value="2014">2014</option>
      <option value="2015">2015</option>
      <option value="2016">2016</option>
      <option value="2017">2017</option>
      <option value="2018">2018</option>
      <option value="2019">2019</option>
      <option value="2020">2020</option>
      <option value="2021">2021</option>
      <option value="2022">2022</option>
      <option value="2023">2023</option>
      <option value="2024">2024</option>
      <option value="2025">2025</option>
    </select>
  </p>
  
  <p>
    チーム名：
    <select id="teamSelector1" name="team_ids">
      <option value="">チームを選択</option>
      <option value="hanshin">阪神タイガース</option>
      <option value="giants">読売ジャイアンツ</option>
      <option value="yakult">東京ヤクルトスワローズ</option>
      <option value="chunichi">中日ドラゴンズ</option>
      <option value="carp">広島東洋カープ</option>
      <option value="dena">横浜DeNAベイスターズ</option>
      <option value="hawks">福岡ソフトバンクホークス</option>
      <option value="lions">埼玉西武ライオンズ</option>
      <option value="marines">千葉ロッテマリーンズ</option>
      <option value="eagles">東北楽天ゴールデンイーグルス</option>
      <option value="fighters">北海道日本ハムファイターズ</option>
      <option value="baffaloes">オリックスバファローズ</option>
    </select>
  </p>


  <p>
     分析項目（複数選択可）：
     <select id="analysisItems" name="items" multiple size="6">
      <option value="試合">試合</option>
      <option value="打席">打席</option>
      <option value="打数">打数</option>
      <option value="得点">得点</option>
      <option value="安打">安打</option>
      <option value="二塁打">二塁打</option>
      <option value="三塁打">三塁打</option>
      <option value="本塁打">本塁打</option>
      <option value="塁打">塁打</option>
      <option value="打点">打点</option>
      <option value="盗塁">盗塁</option>
      <option value="盗塁刺">盗塁刺</option>
      <option value="犠打">犠打</option>
      <option value="犠飛">犠飛</option>
      <option value="四球">四球</option>
      <option value="故意四">故意四</option>
      <option value="死球">死球</option>
      <option value="三振">三振</option>
      <option value="併殺打">併殺打</option>
      <option value="打率">打率</option>
      <option value="長打率">長打率</option>
      <option value="出塁率">出塁率</option> 
     </select>
     <br>
     <small>※Ctrl（Command）キーを押しながら複数選択できます
     </small>
  </p>

  <div class="button-area">
    <button id="analysisBtn" type="button">分析を実行</button>
  </div>
 </div>
</div>


<style>

.main-container {
  flex-direction: column;
  align-items: center;
  width: 100%;
  gap: 0;
  display: flex;
  margin: 0 auto;
}

h1 {
  color: yellowgreen;
  text-align: center;
  font-size: 40px;
  margin: 15px 0 10px 0;
}

h2 {
  color: cadetblue;
  font-size: 30px;
  margin-top: 20px;
  text-align: center;
}

body {
  background-color: beige;
}

p {
  color: brown;
  font-size: 25px;
  width: 300px;
}

.box {
  display: flex;
  flex-direction: column;
  text-align: center;
  margin: 0;
}

select {
  width: 250px;
  height: 40px;
}

.button-area {
  margin: 30px 0 60px;
}

#analysisBtn {
  padding: 12px 40px;
  font-size: 22px;
  color: white;
  background-color: green;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

#analysisBtn:hover {
  background-color: olivedrab;
}
</style>

<script>
  document.getElementById("analysisBtn").addEventListener("click", () => {
    window.location.href = "analysis.html";
    });
</script>

 </body>
</html>
